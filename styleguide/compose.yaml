# Development container for the styleguide (Vite dev server with HMR).
# `make up` builds and runs it; `make down` stops it. Run from the repo root,
# which is why the build context is the parent directory.
name: volta

services:
  styleguide:
    build:
      context: ..
      dockerfile: styleguide/Dockerfile
    image: volta-styleguide
    ports:
      - "${STYLEGUIDE_PORT:-8888}:8888"
    volumes:
      # Live-edit the source from the host. The anonymous volume keeps the
      # image's installed node_modules from being hidden by the bind mount;
      # `make up` renews it so a rebuilt image's dependencies always win.
      - ..:/app
      - /app/node_modules
    healthcheck:
      # The slim Node image has no curl or wget; Node's built-in fetch does.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8888/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
